<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Flight Airline - Iniciar sesión · </title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="encabezado">
    <a href="index.html" class="marca" style="text-decoration: none;">Happy Flight <span>Airline</span></a>

    <div class="acciones-sesion">
      <a href="registro.html" class="btn-sesion registro">Registrarse</a>
    </div>
  </header>

  <main>
    <section class="seccion auth">
      <h2>Iniciar sesión</h2>
      <p class="subtitulo">Accede a tu cuenta para gestionar tus reservas.</p>

      <form id="form-login" class="formulario auth-form" novalidate>
        <label>Correo electrónico
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
        </label>

        <label>Contraseña
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </label>

        <p id="login-error" class="auth-error" role="alert" hidden></p>

        <button class="boton" type="submit" id="btn-login">Entrar</button>

        <p class="auth-alt">
          ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>
      </form>
    </section>
  </main>

  <footer>© 2026 Happy Flight Airline · Demo</footer>
  <script src="js/login.js"></script>
</body>
</html>
